<!-- VERSION: NETAX eCard v2.0 -->
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light only">
  <title>조종호 세무사 | 이음세무컨설팅 NETAX</title>
  <meta name="description" content="이음세무컨설팅 NETAX 조종호 세무사 전자명함">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="ecard">
    <header class="top">
      <img class="logo" src="assets/netax-logo.png" alt="NETAX">
      <div class="company">이음세무컨설팅</div>
      <h1>조종호 세무사</h1>
      <p class="tagline">상속준비와 자산승계의 든든한 파트너</p>
    </header>

    <section class="contact" aria-label="연락처">
      <button class="row" type="button" data-sheet="phone-office">
        <b>T</b><span class="readable number">031-342-9354</span><i>›</i>
      </button>
      <button class="row" type="button" data-sheet="phone-mobile">
        <b>M</b><span class="readable number">010-6341-9354</span><i>›</i>
      </button>
      <button class="row" type="button" data-sheet="kakao">
        <b>K</b><span>카카오채널</span><i>›</i>
      </button>
      <button class="row" type="button" data-sheet="fax">
        <b>F</b><span class="readable number">0508-118-0935</span><i>›</i>
      </button>
      <button class="row" type="button" data-sheet="email">
        <b>E</b><span class="readable email">tax@netax.kr</span><i>›</i>
      </button>
      <button class="row address" type="button" data-sheet="address">
        <b>A</b><span class="addr-wrap"><span class="addr-line">안양시 동안구 시민대로 273</span><em>효성인텔리안 215호</em></span><i>›</i>
      </button>
      <button class="row" type="button" data-sheet="home">
        <b>H</b><span class="readable url">netax.kr</span><i>›</i>
      </button>
    </section>

    <section class="services" aria-label="주요 서비스">
      <div class="section-title"><span>◇</span><strong>주요 서비스</strong><span>◇</span></div>
      <p>상속세 · 증여세 · 양도소득세</p>
      <p>세무조사 · 자료제출</p>
      <p>불복청구 · 경정청구</p>
    </section>

    <section class="trust" aria-label="경력">
      <p class="main-career">국세청 37년 근무</p>
      <p class="sub-career">(세무조사 25년)</p>
      <p class="office-career">동안양세무서장 역임</p>
    </section>
  </main>
  <div class="sheet-backdrop" id="sheetBackdrop" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-label="동작 선택">
      <div class="sheet-title" id="sheetTitle"></div>
      <div class="sheet-actions" id="sheetActions"></div>
      <button class="sheet-cancel" type="button" id="sheetCancel">취소</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
