<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>고객포털 — 이음세무컨설팅</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231b2a41'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='34' font-weight='700' fill='%23c9a227' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0D1B3D;
    --navy-light:#1A2B4D;
    --gold:#C8A244;
    --ink:#22293A;
    --paper:#F8F6F2;
    --line:#E3DFD6;
    --danger:#c0392b;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html, body{ height:100%; }
  body{
    font-family:'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
    color:var(--ink);
    background:var(--paper);
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  h1,h2,.serif{ font-family:'Noto Serif KR', serif; }
  a{ color:inherit; }

  .portal-header{
    width:100%;
    background:linear-gradient(135deg, var(--navy), var(--navy-light));
    border-bottom:3px solid var(--gold);
    color:#fff;
    padding:18px 20px 30px;
    text-align:center;
  }
  .title-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin-bottom:6px;
  }
  .back-link{
    display:inline-flex; align-items:center; gap:5px; flex-shrink:0;
    font-size:12.5px; color:rgba(255,255,255,0.75); text-decoration:none;
  }
  .back-link:hover{ color:#fff; text-decoration:underline; }

  .badge{
    display:inline-flex; align-items:center; gap:6px; flex-shrink:0;
    font-size:11.5px; letter-spacing:0.06em; color:var(--gold);
    border:1px solid rgba(200,162,68,0.5); border-radius:20px;
    padding:4px 12px;
  }
  .title-row h1{ flex:1; font-size:21px; font-weight:700; }
  .portal-header p{ font-size:12.5px; color:rgba(255,255,255,0.72); line-height:1.5; }

  .card-body{
    flex:1;
    width:100%;
    max-width:460px;
    margin:0 auto;
    padding:28px 24px 40px;
  }
  .intro{
    font-size:12.5px; color:#5b6270; line-height:1.6; background:#F8F6F2;
    border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:20px;
  }
  .intro b{ color:var(--navy); }

  label{ display:block; font-size:12.5px; font-weight:600; color:#555; margin-bottom:6px; }
  .pw-hint{ font-size:11.5px; color:#8a8f99; margin:-10px 0 16px; line-height:1.5; }
  input{
    width:100%;
    padding:13px 14px;
    font-size:16px;
    border:1px solid #d9d9d9;
    border-radius:6px;
    margin-bottom:16px;
    letter-spacing:1px;
    font-family:inherit;
  }
  input:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(200,162,68,0.15); }
  button{
    width:100%;
    padding:14px;
    font-size:15px;
    font-weight:700;
    color:#fff;
    background:var(--navy);
    border:none;
    border-radius:6px;
    cursor:pointer;
    transition:background .15s;
  }
  button:hover{ background:var(--navy-light); }
  button:disabled{ opacity:0.55; cursor:default; }

  .msg{ margin-top:14px; font-size:13px; text-align:center; min-height:18px; }
  .msg.error{ color:var(--danger); }
  .msg.info{ color:#555; }

  .secure-line{
    display:flex; align-items:center; justify-content:center; gap:6px;
    font-size:11.5px; color:#9aa0aa; margin-top:16px;
  }
</style>
</head>
<body>
  <header class="portal-header">
    <div class="title-row">
      <div class="badge">🔒 고객 전용</div>
      <h1>고객포털</h1>
      <a class="back-link" href="/">홈페이지로 가기 →</a>
    </div>
    <p>자료 제출과 보고서 확인을 진행합니다.</p>
  </header>

  <main class="card-body">
      <div class="intro" id="noCodeIntro" style="display:none;">
        <b>접속코드가 없으신가요?</b><br>
        접속코드는 이음세무컨설팅에 서비스를 의뢰하신 경우 자동으로 발급됩니다.
      </div>
      <form id="loginForm">
        <div id="codeFieldWrap">
          <label for="reportId">접속코드</label>
          <input id="reportId" maxlength="4" autocapitalize="characters" placeholder="예: A7YT" required>
        </div>

        <label for="password" id="pwLabel">비밀번호</label>
        <input id="password" type="password" placeholder="비밀번호 입력" required>
        <div class="pw-hint" id="pwHint">처음 접속하시는 경우, 입력하신 비밀번호로 새로 설정됩니다.</div>

        <button type="submit" id="submitBtn">확인</button>
      </form>
      <div class="msg" id="msg"></div>

      <div class="secure-line">🔒 입력하신 정보는 암호화되어 담당 세무사에게만 전달됩니다</div>
  </main>

  <script src="/my/config.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const msgEl = document.getElementById('msg');
    const pwLabel = document.getElementById('pwLabel');
    const submitBtn = document.getElementById('submitBtn');
    let isSetupMode = false;

    // 고객은 항상 문자로 받은 링크(https://netax.kr/my/?report_id=XXXX)로 들어오므로,
    // 접속코드 입력칸은 평소엔 아예 숨기고 비밀번호만 입력하면 되게 한다.
    // 만약 링크 없이(코드 없이) 직접 들어온 경우에만 접속코드 입력칸과 안내문구를 보여준다.
    (function prefillReportId(){
      const params = new URLSearchParams(location.search);
      const fromUrl = (params.get('report_id') || '').trim().toUpperCase();
      if (fromUrl) {
        document.getElementById('reportId').value = fromUrl;
        document.getElementById('codeFieldWrap').style.display = 'none';
        document.getElementById('reportId').required = false;
        document.getElementById('password').focus();
      } else {
        document.getElementById('noCodeIntro').style.display = '';
      }
    })();

    function showMsg(text, type) {
      msgEl.textContent = text || '';
      msgEl.className = 'msg' + (type ? ' ' + type : '');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const reportId = document.getElementById('reportId').value.trim().toUpperCase();
      const password = document.getElementById('password').value;
      if (!reportId || !password) return;

      submitBtn.disabled = true;
      showMsg('확인 중입니다...', 'info');

      try {
        const passwordHash = await sha256Hex(password);
        const result = await callGas({ action: 'login', report_id: reportId, password_hash: passwordHash });

        if (result.needs_setup) {
          isSetupMode = true;
          pwLabel.textContent = '최초 접속입니다. 사용할 비밀번호를 설정해주세요';
          document.getElementById('pwHint').style.display = 'none';
          showMsg(result.customer_name + '님, 비밀번호를 설정해주세요.', 'info');
          document.getElementById('password').value = '';
          submitBtn.disabled = false;
          return;
        }
        if (!result.success) {
          showMsg(result.message || '오류가 발생했습니다.', 'error');
          submitBtn.disabled = false;
          return;
        }

        saveSession({
          report_id: reportId,
          password_hash: passwordHash,
          customer_name: result.customer_name,
          case_name: result.case_name
        });

        showMsg(result.customer_name + '님, 확인되었습니다.', 'info');
        renderMenu();
      } catch (err) {
        showMsg('연결 중 오류가 발생했습니다: ' + err.message, 'error');
        submitBtn.disabled = false;
      }
    });

    function renderMenu() {
      document.querySelector('.card-body').innerHTML = `
        <div style="text-align:center;">
          <p style="margin-bottom:20px;color:#555;font-size:13.5px;">이용하실 메뉴를 선택해주세요.</p>
          <button style="margin-bottom:12px;" onclick="location.href='/my/upload/'">📤 자료제출함</button>
          <button style="background:#555;" onclick="location.href='/my/report/'">📄 보고서함</button>
        </div>
      `;
    }

    // 이미 로그인 세션이 있으면 바로 메뉴 표시
    (function initFromSession() {
      const s = loadSession();
      if (s && s.report_id && s.password_hash) {
        renderMenu();
      }
    })();
  </script>
</body>
</html>
